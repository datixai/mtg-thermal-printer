# ============================================================
# MTG THERMAL PRINTER — CONFIGURATION FILE
# Datix AI | Ahmed Ali | datixai.com
# ============================================================
# After editing this file, restart the service:
#   sudo systemctl restart mtg-printer.service

[APP]
booting_status          = Booting...
ready_status            = Ready
refreshing_status       = Refreshing...
fetching_status         = Fetching card...
printing_status         = Printing...
cancelled_status        = Cancelled
error_status            = Error!
reset_status            = Reset
done_status             = Done!
done_status_seconds     = 2.5
no_db_status            = No DB! Run update
services_unavail_status = Unavailable
no_cmc_status_template  = No cards: CMC {cmc}
shutdown_timeout        = 5.0
# Set simulation_mode = true on Windows for development (no GPIO/hardware)
simulation_mode         = false

[HARDWARE]
# Serial port for thermal printer
serial_port             = /dev/serial0
serial_baud_rate        = 9600
printer_dtr_enabled     = true
# BCM GPIO pin numbers (NOT physical pin numbers)
gpio_encoder_clk        = 13
gpio_encoder_dt         = 6
gpio_encoder_sw         = 5
gpio_printer_dtr        = 17
printer_dtr_active_high = false
# OLED display I2C settings
i2c_address             = 0x3C
i2c_port                = 1
oled_width              = 128
oled_height             = 64
# Display font sizes
display_font_size_cmc   = 38
display_font_size_status= 11
display_status_y_offset = 48
display_status_default  = Init...
# Font paths (relative to project root)
display_font_cmc_path   = fonts/DejaVuSans-Bold.ttf
display_font_status_path= fonts/DejaVuSans.ttf
display_cmc_prefix      = CMC
display_padding_x       = 4
display_cmc_value_gap   = 6
# Seconds to hold button for long-press (config mode)
hold_time               = 3.0
cmc_min                 = 0
cmc_max                 = 16
dtr_poll_interval       = 0.1
printer_dtr_timeout     = 10.0

[PRINTER]
paper_width_mm          = 57
paper_width_chars       = 32
card_art_enabled        = true
qr_code_enabled         = true
qr_code_size            = 3
dpi                     = 203
# Your printer's USB vendor/product IDs (check with: lsusb)
vendor_id               = 0x0416
product_id              = 0x5011
printer_profile         = default
# 57mm paper at 203dpi = 454px wide. Use 384 for safety margin.
printer_media_width_px  = 384
min_title_spacing       = 2

[SCRYFALL]
base_url                = https://api.scryfall.com
bulk_data_endpoint      = /bulk-data
header_accept           = application/json
header_user_agent       = DatixAI-MTGPrinter/1.0
header_accept_encoding  = gzip
request_delay_seconds   = 0.1
max_retries             = 3
art_width_px            = 384
# Sets to exclude (comma separated)
excluded_sets           = funny,memorabilia
# Card layouts to exclude
excluded_layouts        = token,emblem,art_series,double_faced_token,reversible_card

[FILTERS]
# Card types included in random selection (true = enabled)
artifact                = true
battle                  = true
creature                = true
enchantment             = true
instant                 = true
planeswalker            = true
sorcery                 = true
# Always disabled
conspiracy              = false
dungeon                 = false
land                    = false
scheme                  = false
vanguard                = false
kindred                 = false

[FILESYSTEM]
cards_path              = data/cards
art_path                = data/art
default_art_path        = assets/default_art.png
access_rights           = 0o755

[LOGGING]
log_level               = INFO
log_format              = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format         = %Y-%m-%d %H:%M:%S
log_file                = logs/mtg_printer.log
max_log_bytes           = 5242880
log_backup_count        = 3

[WEB]
# Web interface accessible at http://[PI-IP]:5000
host                    = 0.0.0.0
port                    = 5000
debug                   = false
# Change this secret key for security
secret_key              = datixai-mtg-printer-change-me-2026
